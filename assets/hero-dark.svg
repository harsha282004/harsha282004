<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="soft">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="180" cy="150" rx="230" ry="120"
           fill="#2563eb" opacity="0.18" filter="url(#blur)">
    <animate attributeName="cx"
             values="180;300;180"
             dur="8s"
             repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="1000" cy="120" rx="240" ry="130"
           fill="#06b6d4" opacity="0.13" filter="url(#blur)">
    <animate attributeName="cx"
             values="1000;850;1000"
             dur="10s"
             repeatCount="indefinite"/>
  </ellipse>

  <!-- Moving particles -->
  <g fill="#60a5fa">
    <circle cx="80" cy="70" r="2">
      <animate attributeName="cy" values="70;45;70" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="270" cy="220" r="2">
      <animate attributeName="cy" values="220;190;220" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.9;.2" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="900" cy="65" r="2">
      <animate attributeName="cy" values="65;35;65" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;1;.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1080" cy="225" r="2">
      <animate attributeName="cy" values="225;195;225" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.9;.2" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Decorative animated lines -->
  <path d="M0 245 Q300 170 600 245 T1200 220"
        fill="none"
        stroke="url(#glow)"
        stroke-width="2"
        opacity="0.45">
    <animate
      attributeName="d"
      values="
      M0 245 Q300 170 600 245 T1200 220;
      M0 220 Q300 270 600 205 T1200 245;
      M0 245 Q300 170 600 245 T1200 220"
      dur="8s"
      repeatCount="indefinite"/>
  </path>

  <path d="M0 260 Q300 190 600 260 T1200 235"
        fill="none"
        stroke="#38bdf8"
        stroke-width="1"
        opacity="0.25">
    <animate
      attributeName="d"
      values="
      M0 260 Q300 190 600 260 T1200 235;
      M0 235 Q300 285 600 220 T1200 260;
      M0 260 Q300 190 600 260 T1200 235"
      dur="9s"
      repeatCount="indefinite"/>
  </path>

  <!-- Main title -->
  <text x="600" y="125"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="54"
        font-weight="700"
        fill="white">
    M Harshavardhana
    <animate attributeName="opacity"
             values="0;1;1;0"
             dur="8s"
             repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="600" y="165"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        fill="#93c5fd">
    Computer Science · Full-Stack Developer
  </text>

  <!-- Animated accent -->
  <rect x="430" y="190" width="340" height="2" rx="1"
        fill="url(#glow)">
    <animate attributeName="width"
             values="80;340;80"
             dur="5s"
             repeatCount="indefinite"/>
    <animate attributeName="x"
             values="560;430;560"
             dur="5s"
             repeatCount="indefinite"/>
  </rect>

  <!-- Small technical labels -->
  <text x="600" y="225"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        fill="#64748b">
    AI / ML · NLP · RAG · Computer Vision · Full Stack
  </text>
</svg>
